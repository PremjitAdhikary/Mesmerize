  <link rel="stylesheet" href="./compstyle.css">
  <script src="../components/app-header.js" type="module"></script>
  <script src="../components/sketch-text.js" type="module"></script>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="./main.js" type="module"></script>

<body>
  <div class="toplevel">
    <app-header class="heading"></app-header>
    <div class="topbody">
      <div class="container">
          <div class="sketch">
            <div id="sketch-holder" class="sketch-holder">
                <canvas id="myCanvas" width="640" height="480" style="width: 640px; height: 480px;"></canvas>
            </div>
          </div>

          <div class="control">
            <div class="control-container">
              <div class="choices">
                <p>
                  <radio-group id="choice_color">
                    <radio-button value="1" aria-checked="true">None</radio-button>
                    <radio-button value="2">Diffuse Red</radio-button>
                    <radio-button value="3">Emit Red</radio-button>
                  </radio-group>
                </p>
              </div>
              <div class="sliders">
                <p>
                  <label for="box_size_slider">Size: </label>
                  <range-input min="1" max="2" step="0.1" id="box_size_slider"></range-input>
                </p>
              </div>
            </div>
          </div>

          <sketch-text class="description" pageid="1003">
            <div slot="content">
              <p>
                Simple Demo with Babylon.
              </p>
            </div>
            <div slot="source">
              <p>
                Add Sources here.
              </p>
            </div>
          </sketch-text>
      </div>
    </div>
  </div>
</body>
